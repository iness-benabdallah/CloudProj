<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Organizer Dashboard</title>

    <link rel="stylesheet" href="css/style.css">


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="js/storage.js" defer></script>
    <script src="js/system.js" defer></script>

</head>


<body>


    <header>

        <h1>
            <a href="index.html">
                HTW Campus Events
            </a>
        </h1>


        <nav>

            <a href="index.html">
                Events
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </nav>

    </header>




    <main>


        <section>

            <h2>
                Organizer Dashboard
            </h2>



            <form id="event-form">

                <h3>
                    Add New Event
                </h3>



                <label for="title">
                    Event Title:
                </label>

                <input
                    type="text"
                    id="title"
                    name="title">

                <p id="title-error"></p>


                <label for="date">
                    Date:
                </label>

                <input
                    type="date"
                    id="date"
                    name="date">

                <p id="date-error"></p>



                <label for="department">
                    Department:
                </label>

                <select
                    id="department"
                    name="department">

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Business">
                        Business
                    </option>

                </select>


                <label for="category">
                    Category:
                </label>

                <select
                    id="category"
                    name="category">

                    <option value="Workshop">
                        Workshop
                    </option>

                    <option value="Event">
                        Event
                    </option>

                </select>



                <label for="description">
                    Description:
                </label>

                <textarea
                    id="description"
                    name="description">
                </textarea>

                <p id="description-error"></p>



                <button type="submit">
                    Add Event
                </button>

            </form>




            <section>

                <h2>
                    Upcoming Events
                </h2>


                <div id="dashboard-events"></div>

            </section>


        </section>


    </main>



    <footer>

        <p>
            HTW Campus Events © 2026
        </p>

    </footer>


</body>

</html>
